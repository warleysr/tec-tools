<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEC-Tools</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        </div>
        <div>
          <h3>TEC-Tools</h3>
          <span>Wheel & Anki & IA</span>
        </div>
      </div>
      <button class="settings-btn" id="btnOpenOptions" title="Abrir Configurações">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </header>

    <div class="status-card">
      <div class="status-indicator">
        <span class="dot" id="ankiDot"></span>
        <span id="ankiStatusText">Verificando AnkiConnect...</span>
      </div>
      <div class="shortcut-tip">
        <span>Atalho na página:</span>
        <kbd id="popupShortcut">Alt + W</kbd>
      </div>
    </div>

    <div class="features-list">
      <div class="feature-item">
        <div class="feature-icon anki-icon">🎴</div>
        <div class="feature-text">
          <strong>Enviar para o Anki</strong>
          <span>Envia questão resolvida com frente e verso customizáveis.</span>
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-icon ai-icon">✨</div>
        <div class="feature-text">
          <strong>Explicar com IA</strong>
          <span>Janela translúcida com análise didática completa.</span>
        </div>
      </div>
    </div>

    <div class="actions-group">
      <button class="btn-action primary" id="btnOpenWheel">✨ Abrir Wheel Menu (Alt+W)</button>
      <button class="btn-action secondary" id="btnGoTec" style="margin-top: 6px;">Ir para o TEC Concursos</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
